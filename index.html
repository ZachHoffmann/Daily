<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daily">
  <meta name="theme-color" content="#f8fafc">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><text x='50' y='64' font-size='44' font-family='-apple-system, sans-serif' font-weight='800' fill='%23ffffff' text-anchor='middle'>D</text></svg>">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-subtle: #f1f5f9;
      --border: #e2e8f0;
      --border-focus: #94a3b8;
      --navy-900: #0f172a;
      --navy-800: #1e293b;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --accent: #2563eb;
      --danger: #ef4444;
      --badge-meal-bg: #e2e8f0;
      --badge-meal-txt: #0f172a;
      --badge-energy-bg: #fef3c7;
      --badge-energy-txt: #b45309;
      --badge-bio-bg: #ede9fe;
      --badge-bio-txt: #6d28d9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px) 16px;
      overflow-x: hidden;
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 4px 2px 2px 2px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--navy-900);
    }

    .header-date {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .card-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    /* Food Input Row & Inputs */
    .input-row {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 8px;
    }

    input[type="time"],
    input[type="text"] {
      background: var(--card-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text-main);
      font-size: 16px; /* Prevents auto-zoom in Safari iOS */
      outline: none;
      user-select: text;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    input[type="time"] {
      text-align: center;
      font-weight: 600;
      color: var(--navy-900);
    }

    input[type="text"]:focus,
    input[type="time"]:focus {
      border-color: var(--border-focus);
      background: #ffffff;
    }

    .btn-primary {
      width: 100%;
      background: var(--navy-900);
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 13px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.1s ease, transform 0.05s ease;
    }

    .btn-primary:active {
      background: var(--navy-800);
      transform: scale(0.98);
    }

    /* Energy Rating Section */
    .energy-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .btn-energy {
      aspect-ratio: 1;
      background: var(--card-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--navy-900);
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: background-color 0.1s ease, transform 0.05s ease;
    }

    .btn-energy span {
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .btn-energy:active {
      background: var(--navy-900);
      color: #ffffff;
      border-color: var(--navy-900);
      transform: scale(0.94);
    }

    .btn-energy:active span {
      color: rgba(255, 255, 255, 0.7);
    }

    /* Action Buttons */
    .actions-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .btn-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--navy-900);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 11px 14px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .btn-secondary:active {
      background: var(--card-subtle);
      transform: scale(0.98);
    }

    .btn-danger {
      color: var(--danger);
      border-color: #fee2e2;
    }

    .btn-danger:active {
      background: #fef2f2;
    }

    /* Feed Items */
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .log-body {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      overflow: hidden;
    }

    .log-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 5px;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }

    .badge-meal {
      background: var(--badge-meal-bg);
      color: var(--badge-meal-txt);
    }

    .badge-energy {
      background: var(--badge-energy-bg);
      color: var(--badge-energy-txt);
    }

    .badge-biometrics {
      background: var(--badge-bio-bg);
      color: var(--badge-bio-txt);
    }

    .log-time {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .log-text {
      font-size: 0.88rem;
      line-height: 1.35;
      color: var(--text-main);
      word-break: break-word;
      user-select: text;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      padding: 4px;
      font-size: 1.1rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-delete:active {
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 28px 16px;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    /* Minimal Toast */
    #toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom,
