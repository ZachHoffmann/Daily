<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily">
  <meta name="theme-color" content="#352430">
  <link rel="apple-touch-icon" href="Daily.png">
  <link rel="icon" type="image/png" href="Daily.png">
  <style>
    :root {
      --bg-top: #352430; --bg-mid: #1d2d30; --bg-bot: #132023;
      --card: rgba(29, 45, 48, 0.88); --inner: #142023;
      --border: rgba(218, 175, 118, 0.22); --border-focus: #dfa35a;
      --text: #f4ead8; --muted: #b5a895;
      --sun-gold: linear-gradient(180deg, #e8b368 0%, #cf8d46 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    /* Fixes the white/black gap during iOS overscroll bounce */
    html { background-color: var(--bg-top); }
    
    body {
      background-color: var(--bg-top);
      background-image: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 38%, var(--bg-bot) 100%);
      background-attachment: fixed; color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    }
    
    .container { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    header { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 4px 2px; }
    h1 { font-family: ui-serif, Georgia, serif; font-size: 1.7rem; font-weight: 700; color: #f3c886; letter-spacing: -0.01em; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .header-date { font-family: ui-serif, Georgia, serif; font-style: italic; font-size: 0.88rem; color: #dcb39c; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 15px 16px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 240, 215, 0.08);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .card-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .input-row { display: grid; grid-template-columns: 104px 1fr; gap: 8px; }
    input[type="time"], input[type="text"] {
      background: var(--inner); border: 1px solid var(--border); border-radius: 11px;
      padding: 12px; color: var(--text); font-size: 16px; outline: none; user-select: text; color-scheme: dark; width: 100%;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.35);
    }
    input[type="time"] { text-align: center; font-weight: 600; color: #f3c886; }
    input::placeholder { color: rgba(181, 168, 149, 0.55); }
    input:focus { border-color: var(--border-focus); }
    .btn-primary {
      width: 100%; background: var(--sun-gold); color: #1c150e; font-size: 0.94rem; font-weight: 700;
      padding: 13px; border: 1px solid #f2c785; border-radius: 11px; cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 3px 10px rgba(0, 0, 0, 0.25);
    }
    .btn-primary:active { transform: scale(0.98); filter: brightness(0.93); }
    
    .energy-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .btn-energy {
      aspect-ratio: 1; background: var(--inner); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); font-family: ui-serif, Georgia, serif; font-size: 1.2rem; font-weight: 700;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 5px rgba(0,0,0,0.2);
    }
    .btn-energy span { font-family: -apple-system, sans-serif; font-size: 0.58rem; font-weight: 600; color: var(--muted); }
    .btn-energy[data-score="1"] { border-bottom: 3px solid #36656b; }
    .btn-energy[data-score="2"] { border-bottom: 3px solid #63784c; }
    .btn-energy[data-score="3"] { border-bottom: 3px solid #a86475; }
    .btn-energy[data-score="4"] { border-bottom: 3px solid #d97f54; }
    .btn-energy[data-score="5"] { border-bottom: 3px solid #e8b368; }
    .btn-energy:active { background: var(--sun-gold); color: #1c150e; border-color: #f2c785; transform: scale(0.95); }
    .btn-energy:active span { color: #1c150e; }

    .insight-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .insight-box {
      background: rgba(20, 32, 35, 0.5); border: 1px solid rgba(218, 175, 118, 0.1); border-radius: 10px;
      padding: 10px 4px; text-align: center; display: flex; flex-direction: column; gap: 4px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
    }
    .insight-val { font-family: ui-serif, Georgia, serif; font-size: 1.05rem; font-weight: 700; color: #f3c886; }
    .insight-label { font-size: 0.55rem; font-weight: 600; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; line-height: 1.25;}
    
    .actions-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .btn-secondary {
      background: var(--card); border: 1px solid var(--border); color: #e8d7be;
      font-size: 0.82rem; font-weight: 600; padding: 11px 14px; border-radius: 12px; cursor: pointer;
    }
    .btn-secondary:active { background: var(--inner); }
    .btn-danger { color: #e08276; border-color: rgba(224, 130, 118, 0.3); }
    
    .feed-container { display: flex; flex-direction: column; gap: 8px; }
    .log-item {
      background: rgba(20, 32, 35, 0.75); border: 1px solid rgba(218, 175, 118, 0.15);
      border-radius: 11px; padding: 11px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .log-body { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow: hidden; }
    .log-meta { display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; letter-spacing: 0.04em; }
    .badge-meal { background: rgba(217, 127, 84, 0.2); color: #f09c75; }
    .badge-energy { background: rgba(232, 179, 104, 0.2); color: #f3c886; }
    .badge-biometrics { background: rgba(168, 100, 117, 0.25); color: #e09eae; }
    .log-time { font-size: 0.72rem; color: var(--muted); }
    .log-text { font-size: 0.88rem; line-height: 1.38; color: var(--text); word-break: break-word; user-select: text; }
    .btn-delete { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; font-size: 1.15rem; line-height: 1; }
    
    .empty-state { text-align: center; padding: 24px 12px; color: var(--muted); font-size: 0.82rem; font-style: italic; font-family: ui-serif, Georgia, serif; }
    
    #toast {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); left: 50%;
      transform: translateX(-50%) translateY(80px); background: #2b3f42; color: #f3c886;
      border: 1px solid #dfa35a; padding: 9px 18px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
      box-shadow: 0 6px 20px rgba(0,0,0,0.45); opacity: 0; pointer-events: none; transition: 0.2s ease; z-index: 100;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Daily</h1>
      <div class="header-date" id="currentDateDisplay"></div>
    </header>

    <section class="card">
      <div class="card-title">Log Meal / Snack</div>
      <div class="input-row">
        <input type="time" id="mealTime" aria-label="Meal Time">
        <input type="text" id="foodInput" placeholder="e.g. Burger, Fries, Water" autocomplete="off" enterkeyhint="done">
      </div>
      <button class="btn-primary" id="btnRecordFood">Record Meal</button>
    </section>

    <section class="card">
      <div class="card-title">Energy Level (1-5)</div>
      <div class="energy-grid">
        <button class="btn-energy" data-score="1">1<span>Low</span></button>
        <button class="btn-energy" data-score="2">2<span>Sluggish</span></button>
        <button class="btn-energy" data-score="3">3<span>Neutral</span></button>
        <button class="btn-energy" data-score="4">4<span>Good</span></button>
        <button class="btn-energy" data-score="5">5<span>Sharp</span></button>
      </div>
    </section>

    <section class="card">
      <div class="card-title">Synthesis</div>
      <div class="insight-grid" id="insightsGrid">
        <!-- Rendered via JS -->
      </div>
    </section>

    <div class="actions-row">
      <button class="btn-secondary" id="btnExportAI">Copy for AI Export</button>
      <button class="btn-secondary btn-danger" id="btnClearAll">Clear</button>
    </div>

    <section class="card">
      <div class="card-title">Activity Feed</div>
      <div class="feed-container" id="feedContainer"></div>
    </section>
  </div>
  <div id="toast">Copied</div>

  <script>
    const STORAGE_KEY = 'daily_tracker_data';
    let logs = [];

    function init() {
      document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      resetMealTime();
      try { logs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { logs = []; }
      const p = new URLSearchParams(window.location.search);
      if (p.get('sleep') || p.get('hrv') || p.get('rhr')) {
        const parts = [];
        if (p.get('sleep')) parts.push('Sleep ' + parseFloat(p.get('sleep')) + ' hrs');
        if (p.get('hrv')) parts.push('HRV ' + Math.round(parseFloat(p.get('hrv'))) + ' ms');
        if (p.get('rhr')) parts.push('RHR ' + Math.round(parseFloat(p.get('rhr'))) + ' bpm');
        addLog('biometrics', parts.join(' | '), new Date().toISOString());
        showToast('Biometrics Synced');
        window.history.replaceState({}, document.title, window.location.origin + window.location.pathname);
      }
      renderFeed();
      setupEvents();
    }

    function resetMealTime() {
      const now = new Date();
      document.getElementById('mealTime').value = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    function saveLogs() { localStorage.setItem(STORAGE_KEY, JSON.stringify(logs)); }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function addLog(type, content, iso) {
      logs.unshift({ id: Date.now() + Math.random(), timestamp: iso || new Date().toISOString(), type, content });
      logs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      saveLogs(); 
      renderFeed();
    }

    function updateInsights() {
      const el = document.getElementById('insightsGrid');
      if (!el) return;

      if (logs.length < 5) {
        el.innerHTML = '<div class="empty-state" style="grid-column: span 3; padding: 10px;">Insights compile as you log more data.</div>';
        return;
      }

      const chronLogs = [...logs].reverse();

      // 1. Peak Energy Window (Avg time of 4 & 5 ratings)
      let highEnergyTimes = [];
      chronLogs.forEach(l => {
        if (l.type === 'energy' && (l.content.startsWith('4') || l.content.startsWith('5'))) {
          const d = new Date(l.timestamp);
          highEnergyTimes.push(d.getHours() * 60 + d.getMinutes());
        }
      });
      let peakTimeStr = '--:--';
      if (highEnergyTimes.length > 0) {
        const avgMins = highEnergyTimes.reduce((a,b)=>a+b, 0) / highEnergyTimes.length;
        const h = Math.floor(avgMins / 60);
        const m = Math.floor(avgMins % 60);
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = h % 12 || 12;
        peakTimeStr = `${h12}:${m.toString().padStart(2, '0')} ${ampm}`;
      } else if (chronLogs.some(l => l.type === 'energy')) {
        peakTimeStr = 'N/A';
      }

      // 2. Post-Meal Crash Rate (1-2 energy within 3hrs of a meal)
      let mealsTotal = 0, crashesTotal = 0;
      for (let i = 0; i < chronLogs.length; i++) {
        if (chronLogs[i].type === 'meal') {
          mealsTotal++;
          const mealTime = new Date(chronLogs[i].timestamp).getTime();
          for (let j = i + 1; j < chronLogs.length; j++) {
            const nextLog = chronLogs[j];
            if (new Date(nextLog.timestamp).getTime() - mealTime > 3 * 60 * 60 * 1000) break;
            if (nextLog.type === 'energy' && (nextLog.content.startsWith('1') || nextLog.content.startsWith('2'))) {
              crashesTotal++; break;
            }
          }
        }
      }
      let crashRateStr = mealsTotal > 0 ? Math.round((crashesTotal / mealsTotal) * 100) + '%' : '--%';

      // 3. Sleep Delta (>7h vs <7h)
      const days = {};
      chronLogs.forEach(l => {
        const dStr = new Date(l.timestamp).toISOString().split('T')[0];
        if (!days[dStr]) days[dStr] = { sleep: null, energy: [] };
        if (l.type === 'biometrics') {
          const m = l.content.match(/Sleep ([\d.]+) hrs/);
          if (m) days[dStr].sleep = parseFloat(m[1]);
        }
        if (l.type === 'energy') days[dStr].energy.push(parseInt(l.content.charAt(0)));
      });

      let goodSleep = [], badSleep = [];
      Object.values(days).forEach(day => {
        if (day.sleep !== null && day.energy.length > 0) {
          const avgE = day.energy.reduce((a,b)=>a+b,0)/day.energy.length;
          if (day.sleep >= 7) goodSleep.push(avgE); else badSleep.push(avgE);
        }
      });

      let sleepImpactStr = '--';
      if (goodSleep.length > 0 && badSleep.length > 0) {
        const diff = (goodSleep.reduce((a,b)=>a+b,0)/goodSleep.length) - (badSleep.reduce((a,b)=>a+b,0)/badSleep.length);
        sleepImpactStr = (diff > 0 ? '+' : '') + diff.toFixed(1) + ' pt';
      } else if (goodSleep.length > 0) {
        sleepImpactStr = 'Need <7h logs';
      } else if (badSleep.length > 0) {
        sleepImpactStr = 'Need >7h logs';
      }

      el.innerHTML = `
        <div class="insight-box"><div class="insight-val">${peakTimeStr}</div><div class="insight-label">Peak Focus<br>Window</div></div>
        <div class="insight-box"><div class="insight-val">${crashRateStr}</div><div class="insight-label">Dietary<br>Crash Rate</div></div>
        <div class="insight-box"><div class="insight-val">${sleepImpactStr}</div><div class="insight-label">Energy Delta<br>(7h+ Sleep)</div></div>
      `;
    }

    function renderFeed() {
      updateInsights();
      const box = document.getElementById('feedContainer');
      if (!logs.length) { box.innerHTML = '<div class="empty-state">No entries logged yet.</div>'; return; }
      box.innerHTML = logs.map(item => {
        const d = new Date(item.timestamp);
        const timeStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', hour12: true });
        const safe = String(item.content).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        return `<div class="log-item"><div class="log-body"><div class="log-meta"><span class="badge badge-${item.type}">${item.type}</span><span class="log-time">${timeStr}</span></div><div class="log-text">${safe}</div></div><button class="btn-delete" data-id="${item.id}">&times;</button></div>`;
      }).join('');
    }

    function setupEvents() {
      const food = document.getElementById('foodInput'), time = document.getElementById('mealTime');
      const submitMeal = () => {
        const val = food.value.trim();
        if (!val) return;
        const d = new Date();
        if (time.value) { const [h, m] = time.value.split(':').map(Number); d.setHours(h, m, 0, 0); }
        addLog('meal', val, d.toISOString());
        food.value = ''; food.blur(); resetMealTime(); showToast('Meal Recorded');
      };
      document.getElementById('btnRecordFood').addEventListener('click', submitMeal);
      food.addEventListener('keydown', e => { if (e.key === 'Enter') submitMeal(); });

      const labels = { 1: '1/5 - Low', 2: '2/5 - Sluggish', 3: '3/5 - Neutral', 4: '4/5 - Good', 5: '5/5 - Sharp' };
      document.querySelectorAll('.btn-energy').forEach(btn => {
        btn.addEventListener('click', () => {
          const s = btn.getAttribute('data-score');
          addLog('energy', labels[s]); showToast('Logged Energy: ' + s + '/5');
        });
      });

      document.getElementById('feedContainer').addEventListener('click', e => {
        const del = e.target.closest('.btn-delete');
        if (del) { logs = logs.filter(x => x.id !== parseFloat(del.getAttribute('data-id'))); saveLogs(); renderFeed(); }
      });

      document.getElementById('btnClearAll').addEventListener('click', () => {
        if (logs.length && confirm('Clear all logged entries?')) { logs = []; saveLogs(); renderFeed(); showToast('History Cleared'); }
      });

      document.getElementById('btnExportAI').addEventListener('click', () => {
        if (!logs.length) return showToast('No logs to export');
        const lines = logs.slice().reverse().map(x => `[${new Date(x.timestamp).toISOString().replace('T', ' ').slice(0, 16)}] ${x.type.toUpperCase()}: ${x.content}`).join('\n');
        const text = `Chronological food, energy, and biometrics log. Analyze meal timing, energy dips, and sleep/HRV patterns:\n\n${lines}`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast('Copied for AI')).catch(() => fallbackCopy(text));
        } else fallbackCopy(text);
      });
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('Copied for AI');
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  </script>
</body>
</html>
