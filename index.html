<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily">
  <meta name="theme-color" content="#090d16">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><text x='50' y='64' font-size='44' font-family='-apple-system, sans-serif' font-weight='800' fill='%2338bdf8' text-anchor='middle'>D</text></svg>">
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --card-inner: #0d1424;
      --border: #232f48;
      --border-focus: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --accent: #2563eb;
      --accent-glow: #3b82f6;
      --danger: #ef4444;
      --badge-meal-bg: #1e293b;
      --badge-meal-txt: #93c5fd;
      --badge-energy-bg: #2d2615;
      --badge-energy-txt: #fcd34d;
      --badge-bio-bg: #261b3b;
      --badge-bio-txt: #d8b4fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px) 16px;
      overflow-x: hidden;
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 4px 2px;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
    }

    .header-date {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .card-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .input-row {
      display: grid;
      grid-template-columns: 102px 1fr;
      gap: 8px;
    }

    input[type="time"],
    input[type="text"] {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text-main);
      font-size: 16px; /* Prevents auto-zoom in Safari iOS */
      outline: none;
      user-select: text;
      transition: border-color 0.15s ease;
      color-scheme: dark;
    }

    input[type="time"] {
      text-align: center;
      font-weight: 600;
    }

    input[type="text"]:focus,
    input[type="time"]:focus {
      border-color: var(--border-focus);
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 13px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.1s ease, transform 0.05s ease;
    }

    .btn-primary:active {
      opacity: 0.9;
      transform: scale(0.98);
    }

    .energy-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .btn-energy {
      aspect-ratio: 1;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: background-color 0.1s ease, transform 0.05s ease, border-color 0.1s ease;
    }

    .btn-energy span {
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .btn-energy:active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent-glow);
      transform: scale(0.94);
    }

    .btn-energy:active span {
      color: rgba(255, 255, 255, 0.8);
    }

    .actions-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .btn-secondary {
