<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daily">
  <meta name="theme-color" content="#f1f5f9">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><text x='50' y='64' font-size='44' font-family='-apple-system, sans-serif' font-weight='800' fill='%23ffffff' text-anchor='middle'>D</text></svg>">
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --card-subtle: #f8fafc;
      --border: #cbd5e1;
      --border-light: #e2e8f0;
      --navy-900: #0f172a;
      --navy-800: #1e293b;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --accent: #2563eb;
      --danger: #dc2626;
      --badge-meal-bg: #e2e8f0;
      --badge-meal-txt: #0f172a;
      --badge-energy-bg: #fef3c7;
      --badge-energy-txt: #b45309;
      --badge-bio-bg: #ede9fe;
      --badge-bio-txt: #6d28d9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px) 16px;
      overflow-x: hidden;
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 4px 2px;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--navy-900);
    }

    .header-date {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }

    .card-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .input-row {
      display: grid;
      grid-template-columns: 102px 1fr;
      gap: 8px;
    }

    input[type="time"],
    input[type="text"] {
      background: var(--card-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text-main);
      font-size: 16px; /* Prevents auto-zoom in Safari iOS */
      outline: none;
      user-select: text;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    input[type="time"] {
      text-align: center;
      font-weight: 600;
      color: var(--navy-900);
    }

    input[type="text"]:focus,
    input[type="time"]:focus {
      border-color: var(--accent);
      background: #ffffff;
    }

    .btn-primary {
      width: 100%;
      background: var(--navy-900);
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 13px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.1s ease, transform 0.05s ease;
    }

    .btn-primary:active {
      background: var(--navy-800);
      transform: scale(0.98);
    }

    .energy-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .btn-energy {
      aspect-ratio: 1;
      background: var(--card-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--navy-900);
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: background-color 0.1s ease, transform 0.05s ease;
    }

    .btn-energy span {
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .btn-energy:active {
      background: var(--navy-900);
      color: #ffffff;
      border-color: var(--navy-900);
      transform: scale(0.94);
    }

    .btn-energy:active span {
      color: rgba(255, 255, 255, 0.7);
    }

    .actions-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .btn-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--navy-900);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 11px 14px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .btn-secondary:active {
      background: var(--card-subtle);
      transform: scale(0.98);
    }

    .btn-danger {
      color: var(--danger);
      border-color: #fecaca;
    }

    .btn-danger:active {
      background: #fef2f2;
    }

    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-item {
      background: var(--card);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 11px 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .log-body {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow: hidden;
    }

    .log-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }

    .badge-meal {
      background: var(--badge-meal-bg);
      color: var(--badge-meal-txt);
    }

    .badge-energy {
      background: var(--badge-energy-bg);
      color: var(--badge-energy-txt);
    }

    .badge-biometrics {
      background: var(--badge-bio-bg);
      color: var(--badge-bio-txt);
    }

    .log-time {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .log-text {
      font-size: 0.88rem;
      line-height: 1.35;
      color: var(--text-main);
      word-break: break-word;
      user-select: text;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-subtle);
      cursor: pointer;
      padding: 4px 6px;
      font-size: 1.15rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-delete:active {
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 28px 16px;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    #toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--navy-900);
      color: #ffffff;
      padding: 9px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
      pointer-events: none;
      opacity: 0;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
      z-index: 100;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Daily</h1>
      <div class="header-date" id="currentDateDisplay"></div>
    </header>

    <section class="card">
      <div class="card-title">Log Meal / Snack</div>
      <div class="input-row">
        <input type="time" id="mealTime" aria-label="Meal Time" />
        <input 
          type="text" 
          id="foodInput" 
          placeholder="e.g. McDouble, fries, water" 
          autocomplete="off" 
          autocorrect="on" 
          enterkeyhint="done"
        />
      </div>
      <button class="btn-primary" id="btnRecordFood">Record Meal</button>
    </section>

    <section class="card">
      <div class="card-title">Energy Level (1-5)</div>
      <div class="energy-grid">
        <button class="btn-energy" data-score="1">1<span>Low</span></button>
        <button class="btn-energy" data-score="2">2<span>Sluggish</span></button>
        <button class="btn-energy" data-score="3">3<span>Neutral</span></button>
        <button class="btn-energy" data-score="4">4<span>Good</span></button>
        <button class="btn-energy" data-score="5">5<span>Sharp</span></button>
      </div>
    </section>

    <div class="actions-row">
      <button class="btn-secondary" id="btnExportAI">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
        Copy for AI Export
      </button>
      <button class="btn-secondary btn-danger" id="btnClearAll">Clear</button>
    </div>

    <section class="card">
      <div class="card-title">Activity Feed</div>
      <div class="feed-container" id="feedContainer"></div>
    </section>
  </div>

  <div id="toast">Copied to clipboard</div>

  <script>
    const STORAGE_KEY = 'daily_tracker_data';
    let logs = [];

    function init() {
      displayToday();
      resetMealTimeInput();
      loadLogs();
      handleUrlParameters();
      renderFeed();
      setupEventListeners();
    }

    function displayToday() {
      const el = document.getElementById('currentDateDisplay');
      if (!el) return;
      const now = new Date();
      el.textContent = now.toLocaleDateString(undefined, {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });
    }

    function resetMealTimeInput() {
      const el = document.getElementById('mealTime');
      if (!el) return;
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      el.value = `${hours}:${minutes}`;
    }

    function loadLogs() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        logs = stored ? JSON.parse(stored) : [];
        if (!Array.isArray(logs)) logs = [];
      } catch (e) {
        logs = [];
      }
    }

    function saveLogs() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
      } catch (e) {
        console.error('Failed to write to localStorage', e);
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function handleUrlParameters() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const sleep = urlParams.get('sleep');
        const hrv = urlParams.get('hrv');
        const rhr = urlParams.get('rhr');

        if (sleep !== null || hrv !== null || rhr !== null) {
          const parts = [];
          if (sleep) parts.push(`Sleep ${parseFloat(sleep)} hrs`);
          if (hrv) parts.push(`HRV ${Math.round(parseFloat(hrv))} ms`);
          if (rhr) parts.push(`RHR ${Math.round(parseFloat(rhr))} bpm`);

          addLogEntry('biometrics', parts.join(' | '), new Date().toISOString());
          showToast('Biometrics Synced');

          const cleanUrl = window.location.origin + window.location.pathname;
          window.history.replaceState({}, document.title, cleanUrl);
        }
      } catch (err) {
        console.warn('Parameter handling skipped:', err);
      }
    }

    function addLogEntry(type, content, isoString) {
      logs.unshift({
        id: Date.now() + Math.random(),
        timestamp: isoString || new Date().toISOString(),
        type: type,
        content: content
      });
      logs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      saveLogs();
      renderFeed();
    }

    function formatTime(isoString) {
      const date = new Date(isoString);
      return date.toLocaleDateString(undefined, { 
        month: 'short', 
        day: 'numeric' 
      }) + ' · ' + date.toLocaleTimeString(undefined, { 
        hour: 'numeric', 
        minute: '2-digit', 
        hour12: true 
      });
    }

    function escapeHtml(string) {
      const div = document.createElement('div');
      div.textContent = string;
      return div.innerHTML;
    }

    function renderFeed() {
      const container = document.getElementById('feedContainer');
      if (!container) return;
      container.innerHTML = '';

      if (logs.length === 0) {
        container.innerHTML = `<div class="empty-state">No entries logged today.</div>`;
        return;
      }

      logs.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'log-item';

        const badgeClass = item.type === 'meal' ? 'badge-meal' :
                           item.type === 'energy' ? 'badge-energy' : 'badge-biometrics';

        itemEl.innerHTML = `
          <div class="log-body">
            <div class="log-meta">
              <span class="badge ${badgeClass}">${item.type}</span>
              <span class="log-time">${formatTime(item.timestamp)}</span>
            </div>
            <div class="log-text">${escapeHtml(item.content)}</div>
          </div>
          <button class="btn-delete" data-id="${item.id}" aria-label="Delete entry">&times;</button>
        `;

        container.appendChild(itemEl);
      });
    }

    function setupEventListeners() {
      const foodInput = document.getElementById('foodInput');
      const mealTimeInput = document.getElementById('mealTime');
      const btnRecordFood = document.getElementById('btnRecordFood');

      function commitMeal() {
        if (!foodInput) return;
        const text = foodInput.value.trim();
        if (!text) return;

        let entryDate = new Date();
        if (mealTimeInput && mealTimeInput.value) {
          const [hours, minutes] = mealTimeInput.value.split(':').map(Number);
          entryDate.setHours(hours, minutes, 0, 0);
        }

        addLogEntry('meal', text, entryDate.toISOString());
        foodInput.value = '';
        foodInput.blur();
        resetMealTimeInput();
      }

      if (btnRecordFood) btnRecordFood.addEventListener('click', commitMeal);
      if (foodInput) {
        foodInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') commitMeal();
        });
      }

      const ratings = {
        '1': '1/5 - Low / Drained',
        '2': '2/5 - Sluggish',
        '3': '3/5 - Neutral / Baseline',
        '4': '4/5 - Good / Steady',
        '5': '5/5 - Sharp / Alert'
      };

      document.querySelectorAll('.btn-energy').forEach(btn => {
        btn.addEventListener('click', () => {
          const score = btn.getAttribute('data-score');
          addLogEntry('energy', ratings[score]);
          showToast(`Logged Energy: ${score}/5`);
        });
      });

      const feedContainer = document.getElementById('feedContainer');
      if (feedContainer) {
        feedContainer.addEventListener('click', (e) => {
          const deleteBtn = e.target.closest('.btn-delete');
          if (deleteBtn) {
            const id = parseFloat(deleteBtn.getAttribute('data-id'));
            logs = logs.filter(entry => entry.id !== id);
            saveLogs();
            renderFeed();
          }
        });
      }

      const btnClearAll = document.getElementById('btnClearAll');
      if (btnClearAll) {
        btnClearAll.addEventListener('click', () => {
          if (logs.length === 0) return;
          if (confirm('Clear all logged entries?')) {
            logs = [];
            saveLogs();
            renderFeed();
            showToast('History cleared');
          }
        });
      }

      const btnExportAI = document.getElementById('btnExportAI');
      if (btnExportAI) {
        btnExportAI.addEventListener('click', () => {
          if (logs.length === 0) {
            showToast('No logs to export');
            return;
          }

          const formatted = logs
            .slice()
            .reverse()
            .map(entry => {
              const date = new Date(entry.timestamp);
              const ts = date.toISOString().replace('T', ' ').substring(0, 16);
              return `[${ts}] ${entry.type.toUpperCase()}: ${entry.content}`;
            })
            .join('\n');

          const payload = `Below is chronological food intake, energy ratings, and Apple Health biometrics. Please analyze for post-meal crashes, meal timing patterns, and energy drivers:\n\n${formatted}`;

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(payload)
              .then(() => showToast('Copied for AI analysis'))
              .catch(() => fallbackCopy(payload));
          } else {
            fallbackCopy(payload);
          }
        });
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position =
